AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Callismatic staging - the web app on Lambda, used by the cross-product end-to-end
  test. Staging only: the production function was deployed by hand and is not managed
  by this template. It has no CALL-E key, so it cannot place a real call.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2

Parameters:
  ImageUri:
    Type: String
    Default: 227214487086.dkr.ecr.us-east-1.amazonaws.com/callismatic:staging
    Description: Container image, from the Dockerfile in this repo
    AllowedPattern: "^.+:staging$"
    ConstraintDescription: Must be an image tagged staging, so a production image is never used here
  StillEventBusArn:
    Type: String
    Description: ARN of the still-staging event bus
    AllowedPattern: "^arn:aws:events:[a-z0-9-]+:[0-9]{12}:event-bus/still-staging$"
    ConstraintDescription: Must be the still-staging bus, never the production bus
  BedrockFoundationModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Model used for triage, called through its us. inference profile
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email for alarm notifications

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  # Generated here, so the admin key never appears in a template or a parameter.
  # Add nothing that can spend money or reach a person: no CALLE_API_KEY, no Twilio.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: Same shape as production's secret; lambda_handler.py loads every key into the environment at cold start
        must: Never add CALLE_API_KEY or Twilio credentials, which would let a test place a real call
    Properties:
      Description: Callismatic staging secrets
      GenerateSecretString:
        SecretStringTemplate: '{"CALLISMATIC_STAGE": "staging"}'
        GenerateStringKey: ADMIN_API_KEY
        PasswordLength: 48
        ExcludePunctuation: true

  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Callismatic web app, staging
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      MemorySize: 1024
      # Outbound agent calls (2026-11-13) run in an async self-invoke that lasts as long as the call.
      Timeout: 600
      Tracing: Active
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          CALLISMATIC_SECRET_ARN: !Ref AppSecret
          BEDROCK_REGION: !Ref AWS::Region
          BEDROCK_MODEL_ID: !Sub us.${BedrockFoundationModelId}
          STILL_EVENT_BUS_ARN: !Ref StillEventBusArn
          # Staging only: outbound jobs run against the scripted fake provider; no call is placed.
          OUTBOUND_AGENT_CALLS_ENABLED: "true"
          OUTBOUND_FAKE_PROVIDER: "true"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AppSecret
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Ref StillEventBusArn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-AppFunction-*
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.${BedrockFoundationModelId}
                - !Sub arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/${BedrockFoundationModelId}
                - !Sub arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/${BedrockFoundationModelId}
                - !Sub arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/${BedrockFoundationModelId}

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppFunction}
      RetentionInDays: 30

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      KmsMasterKeyId: alias/aws/sns
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The Callismatic staging function reported errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AppFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

Outputs:
  FunctionUrl:
    Description: Base URL for the end-to-end test
    Value: !GetAtt AppFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref AppFunction
  AppSecretArn:
    Description: Holds the generated ADMIN_API_KEY
    Value: !Ref AppSecret
