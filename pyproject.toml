[project]
name = "callismatic"
version = "0.2.0"
description = "An autonomous call-triage agent that only interrupts you when a real decision is needed -- and quietly auto-handles or blocks the rest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.1.0",
    "boto3>=1.34.0",
    "assemblyai>=1.5.0",
    "calle-ai>=0.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "phonenumbers>=8.13.0",
    "twilio>=9.0.0",
    "httpx>=0.27.0",
    "mcp>=2.1.1",
]

[project.optional-dependencies]
demo = ["pyttsx3>=2.90"]
# Also covers calendar_sync.py -- Google Sheets and Google Calendar share the same
# service-account auth pattern and the same client libraries.
google = ["google-api-python-client>=2.100.0", "google-auth>=2.20.0"]
whatsapp = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]

[project.scripts]
callismatic = "callismatic.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
